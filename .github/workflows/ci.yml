name: CI

# Checks for pull requests into main, so problems show up before merge.
# deploy.yml re-runs the npm tests on main as a final gate before publishing.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds the site and serves it with `vite preview` (see playwright.config.js).
      # Includes tests/e2e/perf.spec.js: layout shift, overflow and accessibility.
      - run: npm run test:e2e

      # Page-weight budgets against the build the e2e step just made
      # (scripts/perf/budgets.js). Runs even if e2e failed, so both results show.
      - name: Page-weight budgets
        if: ${{ !cancelled() }}
        run: node scripts/perf/check-budgets.js --report

      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  scripts:
    name: Data script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Discovers every test under scripts/tests, wherever the scripts themselves live
      - run: python3 -m unittest discover -s scripts/tests -v

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Dependency review only looks at dependencies a PR changes; this also
      # catches new advisories against packages already in the lockfile.
      # Gated at high: the current moderate/low advisories are all in
      # build-time devDependencies and are tracked by Dependabot alerts.
      - run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
